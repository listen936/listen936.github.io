<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Sort</title>
		<style>
			.wrapper {
				margin: 50px;
			}
			ul {
				display: flex;
				/* justify-content: center; */
				align-items: center;
			}
			li {
				list-style: none;
				margin: 0 10px;
				width: 100px;
				height: 100px;
				border: 1px solid #ccc;
				font-size: 40px;
				text-align: center;
			}
			li.show {
				background-color: bisque;
			}
			.listWrapper {
				display: flex;
			}
			.listWrapper > div {
				margin-right: 50px;
			}

			.orderUser {
				margin: 2px;
				border: 1px solid transparent;
			}
			.selected {
				border: 1px solid red;
			}
		</style>
	</head>
	<body>
		<div class="wrapper">
			<ul></ul>
			<button id="prev" onclick="prevPage()">上一页</button>
			<button id="next" onclick="nextPage()">下一页</button>
		</div>
		<div class="listWrapper">
			<div>
				<p>排好顺序用户列表</p>
				<div class="userList"></div>
			</div>
			<div>
				<p>下一个待展示的用户</p>
				<div class="openUserList"></div>
			</div>
		</div>
	</body>
	<script>
		let id = 0
		function createUser(show) {
			const seq = id + 2
			id = seq
			return {
				id: seq,
				time: seq,
				video: show,
			}
		}
		function findPrevUserIndex() {
			const indexList = []
			showUsers.forEach((user) => {
				indexList.push(orderList.findIndex((item) => item.id === user.id))
			})
			return Math.min(...indexList)
		}
		function findShowUsersLastOneIndex() {
			const indexList = []
			showUsers.forEach((user) => {
				indexList.push(orderList.findIndex((item) => item.id === user.id))
			})
			return Math.max(...indexList)
		}
		function renderShowUsers() {
			const ul = document.querySelector("ul")
			ul.innerHTML = showUsers
				.map((user) => `<li class="user ${user.video ? "show" : ""}">${user.id}</li>`)
				.join("")
		}
		function renderUserList() {
			const userList = document.querySelector(".userList")
			userList.innerHTML = orderList
				.map(
					(user) =>
						`<div class="orderUser ${
							showUsers.findIndex((item) => item.id === user.id) !== -1 ? "selected" : ""
						}">id:${user.id} | time:${user.time} | video: <input type="checkbox" ${
							user.video ? "checked" : ""
						} value="${user.video}" onchange="changeVideo(${user.id})">
                        <button onclick="leaveRoom(${user.id})">Leave</button>
                        </div>`
				)
				.join("")
		}
		function renderOpenUserList() {
			const userList = document.querySelector(".openUserList")
			userList.innerHTML = `<div>id:${nextShowUser?.id} | time:${nextShowUser?.time} | video: ${nextShowUser?.video}</div>`
			// 	.map(
			// 		(user) =>
			// 			`<div class="user">id:${user.id} | time:${user.time} | video: <input type="checkbox" ${
			// 				user.video ? "checked" : ""
			// 			} value="${user.video}" onchange="changeVideo(${user.id})"></div>`
			// 	)
			// 	.join("")
		}
		function renderCloseUserList() {
			// const userList = document.querySelector(".closeUserList")
			// userList.innerHTML = closeVideoUsers
			// 	.map(
			// 		(user) =>
			// 			`<div class="user">id:${user.id} | time:${user.time} | video: <input type="checkbox" ${
			// 				user.video ? "checked" : ""
			// 			} value="${user.video}"></div>`
			// 	)
			// 	.join("")
		}
		function nextPage() {
			if (!nextShowUser || showUsers.find((user) => user.id === nextShowUser?.id)) {
				alert("没有下一页了")
				return
			}
			let nextIndex = orderList.findIndex((user) => user.id === nextShowUser?.id)
			showUsers = orderList.slice(nextIndex, nextIndex + 3)
			// prevShowUser = nextShowUser || orderList[0]
			nextShowUser = orderList[nextIndex + 3] || orderList[orderList.length - 1]
			render()
		}
		function prevPage() {
			const isLastPage = showUsers.find((user) => user.id === nextShowUser?.id)
			let prevIndex =
				orderList.findIndex((user) => user.id === nextShowUser.id) - (isLastPage ? showUsers.length - 1 : 3)
			if (prevIndex <= 0) {
				alert("没有上一页了")
				return
			}
			showUsers = orderList.slice(prevIndex - 3, prevIndex)
			nextShowUser = orderList[prevIndex] || orderList[3]
			if (showUsers.length < 3) {
				showUsers = orderList.slice(0, 3)
				nextShowUser = orderList[3]
			}
			render()
		}
		function leaveRoom(id) {
			const showIndex = showUsers.findIndex((user) => user.id === id)
			const index = orderList.findIndex((user) => user.id === id)
			const nextIndex = orderList.findIndex((user) => user.id === nextShowUser?.id)
			if (showIndex !== -1) {
				if (id === nextShowUser?.id) {
					// 最后一个人离开
					showUsers.splice(showIndex, 1)
					orderList = orderList.filter((user) => user.id !== id)
					nextShowUser = orderList[findShowUsersLastOneIndex() + 1] || orderList[orderList.length - 1]
				} else {
					// 需要补位
					if (!showUsers.find((user) => user.id === nextShowUser?.id)) {
						showUsers.splice(showIndex, 1, nextShowUser)
						nextShowUser = orderList[nextIndex + 1] || orderList[orderList.length - 1]
					} else {
						showUsers.splice(showIndex, 1)
					}
				}
			}
			// 删除用户
			orderList = orderList.filter((user) => user.id !== id)
			if (showUsers.length === 0) {
				showUsers = orderList.slice(orderList.length - 3, orderList.length)
				nextShowUser = orderList[orderList.length - 1]
				// prevShowUser = orderList[orderList.length - 3] || orderList[0]
			}
			render()
		}
		function changeVideo(id) {
			const user = orderList.find((user) => user.id === id)
			const isInOpenVideoUsers = showUsers.every((user) => user.video)
			if (user.video) {
				// 关闭摄像头
				user.video = false
				// 重新排序
				sort()

				//  当前展示用户都是打开摄像头的
				if (isInOpenVideoUsers && nextShowUser.video && showUsers.find((user) => user.id === id)) {
					// 补位
					const nextIndex = orderList.findIndex((user) => user.id === nextShowUser.id)
					const currentIndex = showUsers.findIndex((user) => user.id === id)
					showUsers.splice(currentIndex, 1, nextShowUser)
					nextShowUser = orderList[nextIndex + 1] || orderList[orderList.length - 1]
				}
				if (id === nextShowUser.id) {
					// 如果是关闭下一个待展示用户的，则需要更新下一个待展示用户
					nextShowUser = orderList[findShowUsersLastOneIndex() + 1] || orderList[orderList.length - 1]
				}
			} else {
				// 打开摄像头
				user.video = true
				// 重新排序
				sort()
				// 当前展示用户都是打开摄像头的
				if (isInOpenVideoUsers) {
					// 该用户进房时间位于展示中最后一个用户的进房时间之前
					const lastShowUser = orderList[findShowUsersLastOneIndex()]
					if (user.time <= lastShowUser.time) {
						// 将该用户顶替掉展示中最后一个用户
						const lastUserIndex = showUsers.findIndex((user) => user.id === lastShowUser.id)
						// nextShowUser 更新为被顶替的用户
						nextShowUser = showUsers[lastUserIndex]
						showUsers.splice(lastUserIndex, 1, user)
					} else if (user.time < nextShowUser.time) {
						// 该用户进房时间位于展示中最后一个用户的进房时间之后, 但在下一个待展示用户之前
						nextShowUser = user
					}
				} else {
					if (!showUsers.find((user) => user.id === id)) {
						// 该用户进房时间处于展示位置的后面
						const lastShowUser = orderList[findShowUsersLastOneIndex()]
						if (user.time > lastShowUser.time) {
							// 将该用户顶替掉展示中最后一个用户
							const lastUserIndex = showUsers.findIndex((user) => user.id === lastShowUser.id)
							// nextShowUser 更新为被顶替的用户
							nextShowUser = showUsers[lastUserIndex]
							showUsers.splice(lastUserIndex, 1, user)
						}
					}
				}
			}
			render()
		}
		let users = Array.from({ length: 20 }).map((_, i) => createUser(i % 2 === 0))
		let orderList = []

		function sort() {
			// 当前打开摄像头的用户
			let openVideoUsers = users.filter((user) => user.video).sort((a, b) => a.time - b.time)
			// 当前关闭摄像头的用户
			let closeVideoUsers = users.filter((user) => !user.video).sort((a, b) => a.time - b.time)
			// 排好序的用户
			orderList = openVideoUsers.concat(closeVideoUsers)
		}
		sort()
		// 当前展示的用户
		let showUsers = orderList.slice(0, 3)
		let nextShowUser = orderList[3]
		// let prevShowUser = orderList[0]
		function render() {
			renderOpenUserList()
			renderCloseUserList()
			renderShowUsers()
			renderUserList()
		}
		render()
	</script>
</html>
